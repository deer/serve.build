name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to bump'
        required: true
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Determine Versions
        id: versions
        run: |
          CURRENT_VERSION=$(grep -m1 '<revision>' pom.xml | sed 's/.*<revision>\(.*\)<\/revision>.*/\1/' | tr -d '[:space:]')
          CURRENT_VERSION="${CURRENT_VERSION/-SNAPSHOT/}"

          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          case "${{ inputs.bump }}" in
            major)
              RELEASE_MAJOR=$((MAJOR + 1)); RELEASE_MINOR=0; RELEASE_PATCH=0
              ;;
            minor)
              RELEASE_MAJOR=$MAJOR; RELEASE_MINOR=$((MINOR + 1)); RELEASE_PATCH=0
              ;;
            patch|*)
              RELEASE_MAJOR=$MAJOR; RELEASE_MINOR=$MINOR; RELEASE_PATCH=$PATCH
              ;;
          esac

          RELEASE_VERSION="${RELEASE_MAJOR}.${RELEASE_MINOR}.${RELEASE_PATCH}"
          NEXT_VERSION="${RELEASE_MAJOR}.${RELEASE_MINOR}.$((RELEASE_PATCH + 1))-SNAPSHOT"

          echo "release-version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "next-version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Release Branch
        run: git checkout -b release-${{ steps.versions.outputs.release-version }}

      - name: Set Release Version
        run: |
          ./mvnw versions:set-property \
            -Dproperty=revision \
            -DnewVersion=${{ steps.versions.outputs.release-version }} \
            -DgenerateBackupPoms=false

      - name: Build and Deploy Release
        run: ./mvnw clean deploy
        env:
          MAVEN_PUBLISH: "true"
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Commit and Tag Release
        run: |
          git add pom.xml
          git commit -m "Release ${{ steps.versions.outputs.release-version }}"
          git tag -a v${{ steps.versions.outputs.release-version }} -m "Release ${{ steps.versions.outputs.release-version }}"

      - name: Set Next Development Version
        run: |
          ./mvnw versions:set-property \
            -Dproperty=revision \
            -DnewVersion=${{ steps.versions.outputs.next-version }} \
            -DgenerateBackupPoms=false

      - name: Commit Next Development Version
        run: |
          git add pom.xml
          git commit -m "Prepare for next development iteration ${{ steps.versions.outputs.next-version }}"

      - name: Push Release Branch and Tag
        run: git push --follow-tags origin release-${{ steps.versions.outputs.release-version }}

      - name: Open and Merge PR to main
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head release-${{ steps.versions.outputs.release-version }} \
            --title "Prepare for development of ${{ steps.versions.outputs.next-version }}" \
            --body "Prepares next development iteration **${{ steps.versions.outputs.next-version }}**.")

          gh pr merge "$PR_URL" --squash
